name: Corbu Windows

on:
  push:
    paths:
      - "corbu/**"
      - ".github/workflows/windows.yml"
  workflow_dispatch:

jobs:
  installateur:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: corbu
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dépendances
        run: python -m pip install ".[dev]" pyinstaller

      - name: Tests
        run: python -m pytest tests

      - name: Exécutable (PyInstaller)
        run: pyinstaller --noconfirm --name Corbu --console --collect-data corbu packaging/lanceur.py

      - name: Version
        id: version
        shell: python
        run: |
          import os, tomllib
          with open("pyproject.toml", "rb") as f:
              version = tomllib.load(f)["project"]["version"]
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"version={version}\n")

      - name: Installateur (Inno Setup)
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /DVersion=${{ steps.version.outputs.version }} packaging\corbu.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Version portable (zip)
        run: Compress-Archive -Path dist\Corbu\* -DestinationPath dist\Corbu-${{ steps.version.outputs.version }}-portable.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Corbu-${{ steps.version.outputs.version }}-windows
          path: |
            corbu/dist/Corbu-*-installation.exe
            corbu/dist/Corbu-*-portable.zip
