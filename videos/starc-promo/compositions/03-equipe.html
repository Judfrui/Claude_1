      // La courbe du logo se trace d'un seul geste : balayage angulaire autour du centre de l'arc
      const arcEl = document.getElementById("s3-arc");
      function wedge(p) {
        const cx = 960, cy = 1250.8, R = 1400, a0 = -156, a = a0 + 132 * p, n = 48;
        const pts = [cx + "px " + cy + "px"];
        for (let i = 0; i <= n; i++) {
          const t = (a0 + (a - a0) * i / n) * Math.PI / 180;
          pts.push((cx + R * Math.cos(t)).toFixed(1) + "px " + (cy + R * Math.sin(t)).toFixed(1) + "px");
        }
        return "polygon(" + pts.join(", ") + ")";
      }
      const arcP = { p: 0 };
      tl.fromTo("#s3-arc", { opacity: 0 }, { opacity: 1, duration: 0.01 }, 0.94);
      tl.fromTo(arcP, { p: 0 }, {
        p: 1, duration: 1.5, ease: "power3.inOut",
        onUpdate: function () { arcEl.style.clipPath = wedge(arcP.p); }
      }, 0.95);

      // Les métiers entrent un à un sous la courbe
      const roles = gsap.utils.toArray("#s3-world .s3-role");
      roles.forEach(function (role, i) {
        const t = 2.3 + i * 0.5;
        tl.fromTo(role.querySelectorAll(".s3-ic"), { strokeDashoffset: 1, opacity: 0 }, { strokeDashoffset: 0, opacity: 1, duration: 0.7, ease: "power2.out" }, t);
        tl.fromTo(role.querySelector(".s3-role-label"), { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, t + 0.08);
      });

        v: 25, duration: 1.1, ease: "power2.out",
        onUpdate: function () { document.getElementById("s3-count-25").textContent = Math.round(counter.v); }
      }, 7.2);
      tl.fromTo("#s3-sep-1", { scaleY: 0 }, { scaleY: 1, duration: 0.5, ease: "power3.out" }, 7.55);
      tl.fromTo("#s3-stat-2", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 7.7);
