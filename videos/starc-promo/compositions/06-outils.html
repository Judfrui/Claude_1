    (function () {
      // Nuage de points déterministe d'une maison (projection isométrique)
      let seed = 20260613;
      function rnd() {
        seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
        let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
        t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      }
      const W = 230, D = 170, H = 130, R = 92;
      const c30 = Math.cos(Math.PI / 6), s30 = Math.sin(Math.PI / 6);
      function proj(x, y, z) { return [265 + (x - z) * c30 - 25, 330 + (x + z) * s30 * 0.9 - y - 70]; }
      const pts = [];
      function edge(a, b, n, r) {
        for (let i = 0; i <= n; i++) {
          const t = i / n, j = 1.6;
          pts.push([a[0] + (b[0] - a[0]) * t + (rnd() - 0.5) * j, a[1] + (b[1] - a[1]) * t + (rnd() - 0.5) * j, a[2] + (b[2] - a[2]) * t + (rnd() - 0.5) * j, r]);
        }
      }
      function face(fn, n, r) { for (let i = 0; i < n; i++) { const p = fn(rnd(), rnd()); pts.push([p[0], p[1], p[2], r]); } }
      const E = [
        [[0, 0, 0], [W, 0, 0]], [[W, 0, 0], [W, 0, D]], [[0, 0, 0], [0, 0, D]], [[0, 0, D], [W, 0, D]],
        [[0, 0, 0], [0, H, 0]], [[W, 0, 0], [W, H, 0]], [[W, 0, D], [W, H, D]], [[0, 0, D], [0, H, D]],

        [[0, H + R, D / 2], [W, H + R, D / 2]],
        [[0, H, 0], [0, H + R, D / 2]], [[0, H + R, D / 2], [0, H, D]],
        [[W, H, 0], [W, H + R, D / 2]], [[W, H + R, D / 2], [W, H, D]]
      ];
      E.forEach(function (e) { edge(e[0], e[1], 70, 1.5); });
      // ouvertures en façade avant (z = 0)
      [[28, 70, 0, 72], [100, 140, 40, 100], [170, 205, 50, 100]].forEach(function (o) {
        edge([o[0], o[2], 0], [o[1], o[2], 0], 22, 1.3); edge([o[0], o[3], 0], [o[1], o[3], 0], 22, 1.3);
        edge([o[0], o[2], 0], [o[0], o[3], 0], 18, 1.3); edge([o[1], o[2], 0], [o[1], o[3], 0], 18, 1.3);
      });
      face(function (u, v) { return [u * W, v * H, 0]; }, 380, 0.9);
      face(function (u, v) { return [W, v * H, u * D]; }, 280, 0.9);
      face(function (u, v) { return [u * W, H + v * R, v * D / 2]; }, 300, 0.9);
      face(function (u, v) { return [W, H + v * R * (1 - Math.abs(u - 0.5) * 2), u * D]; }, 90, 0.9);
      face(function (u, v) { return [-90 + u * (W + 200), 0, -60 + v * (D + 160)]; }, 420, 0.8);

      const svg = document.getElementById("s6-cloud");
      const SL = 14, groups = [];
      for (let i = 0; i < SL; i++) {
        const g = document.createElementNS("http://www.w3.org/2000/svg", "g");
        g.setAttribute("class", "s6-slice");
        svg.appendChild(g); groups.push(g);
      }
      pts.forEach(function (p) {
        const q = proj(p[0], p[1], p[2]);
        if (q[0] < 6 || q[0] > 524 || q[1] < 6 || q[1] > 470) return;
        const c = document.createElementNS("http://www.w3.org/2000/svg", "circle");
        c.setAttribute("cx", q[0].toFixed(1)); c.setAttribute("cy", q[1].toFixed(1)); c.setAttribute("r", p[3]);
        groups[Math.min(SL - 1, Math.floor(q[0] / 530 * SL))].appendChild(c);
      });

      const tl = gsap.timeline({ paused: true });

      tl.fromTo("#s6-dash", { scaleX: 0 }, { scaleX: 1, duration: 0.6, ease: "power3.inOut" }, 0.25);
